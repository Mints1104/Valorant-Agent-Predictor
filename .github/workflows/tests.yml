name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # The datasets are public, so no Kaggle token is needed. Their versions are pinned in the
      # code, so the cache only has to change when those files do.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kagglehub
          key: kaggle-${{ hashFiles('src/dataset.py', 'src/dates.py', 'src/form.py') }}

      # The app's requirements only, which also proves that file is enough to run it.
      - run: pip install -r requirements.txt

      - name: Player form only looks backwards
        run: python test_form.py

      - name: The pipeline and app handle awkward inputs
        run: python test_edge_cases.py
